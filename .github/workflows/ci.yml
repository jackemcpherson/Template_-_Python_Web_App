name: Lint and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      - name: Generate project from template
        run: |
          uvx --from copier copier copy --force \
            -d package_name="continuous_integration_app" \
            -d project_description="Generated during CI to validate the template." \
            -d author_name="CI Bot" \
            -d author_email="ci@example.com" \
            -d initial_version="0.1.0" \
            -d github_username="ci-bot" \
            . generated

      - name: Install dependencies
        working-directory: generated
        run: uv sync --all-extras

      - name: Check formatting with ruff
        working-directory: generated
        run: uv run ruff format --check .

      - name: Lint with ruff
        working-directory: generated
        run: uv run ruff check .

      - name: Type check with mypy
        working-directory: generated
        run: uv run mypy

      - name: Scan for security vulnerabilities with bandit
        working-directory: generated
        run: uv run bandit -r src

      - name: Run tests with pytest
        working-directory: generated
        run: uv run pytest

      - name: Build package
        working-directory: generated
        run: uv build
